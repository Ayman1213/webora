<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Webora Teaser</title>
<style>
  html, body { margin: 0; height: 100%; background: #05060f; color: #fff; font-family: "Segoe UI", Tahoma, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  canvas { height: calc(100vh - 80px); aspect-ratio: 9 / 16; border-radius: 18px; box-shadow: 0 0 60px rgba(124, 92, 255, .35); }
  .bar { display: flex; gap: 10px; align-items: center; font-size: 14px; }
  button { background: #7c5cff; color: #fff; border: 0; border-radius: 999px; padding: 10px 22px; font-size: 15px; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div class="bar">
  <button id="rec">تسجيل الفيديو وحفظه</button>
  <span id="status"></span>
</div>
<script>
const W = 1080, H = 1920, DUR = 13, FPS = 30;
const FONT = '"Cairo", "Tajawal", "Segoe UI", Tahoma, sans-serif';
const PURPLE = '#7c5cff', BLUE = '#4aa8ff', RED = '#ff4d6d', NAVY = '#0a0b1e';

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eOut = x => 1 - Math.pow(1 - x, 3);
const eBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };

function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

function hGrad(x0, x1, a = PURPLE, b = BLUE) {
  const g = ctx.createLinearGradient(x0, 0, x1, 0);
  g.addColorStop(0, a); g.addColorStop(1, b);
  return g;
}

function text(str, x, y, size, color, o = {}) {
  const { weight = 800, alpha = 1, scale = 1, align = 'center', dir = 'rtl', glow = 0 } = o;
  if (alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.translate(x, y); ctx.scale(scale, scale);
  ctx.font = `${weight} ${size}px ${FONT}`;
  ctx.direction = dir; ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (glow) { ctx.shadowColor = typeof color === 'string' ? color : PURPLE; ctx.shadowBlur = glow; }
  ctx.fillStyle = color;
  ctx.fillText(str, 0, 0);
  ctx.restore();
}

// text that pops in at time `at`
function pop(t, at, str, x, y, size, color, o = {}) {
  const p = prog(t, at, at + 0.35);
  if (p <= 0) return;
  text(str, x, y, size, color, { ...o, alpha: p * (o.alpha ?? 1), scale: 0.7 + 0.3 * eBack(p) });
}

function background(t, tint) {
  ctx.fillStyle = NAVY; ctx.fillRect(0, 0, W, H);
  const blobs = [
    [W * 0.2 + Math.sin(t * 0.7) * 120, H * 0.22 + Math.cos(t * 0.5) * 90, 620, PURPLE],
    [W * 0.85 + Math.cos(t * 0.6) * 100, H * 0.7 + Math.sin(t * 0.8) * 120, 700, BLUE],
  ];
  for (const [x, y, r, c] of blobs) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, c + '55'); g.addColorStop(1, c + '00');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  ctx.strokeStyle = 'rgba(255,255,255,.035)'; ctx.lineWidth = 2;
  const off = (t * 40) % 90;
  for (let y = -90 + off; y < H; y += 90) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  for (let x = 0; x < W; x += 90) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  if (tint > 0) {
    const g = ctx.createRadialGradient(W / 2, H / 2, 200, W / 2, H / 2, H * 0.7);
    g.addColorStop(0, 'rgba(255,40,80,0)'); g.addColorStop(1, `rgba(255,40,80,${0.45 * tint})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
}

function sceneAlpha(t, a, b, fade = 0.25) {
  return Math.min(prog(t, a, a + fade), 1 - prog(t, b - fade, b));
}

// 1 — the search that finds nothing
function scene1(t) {
  pop(t, 0.1, 'عميلك يبحث عنك الآن…', W / 2, 430, 80, '#fff');

  const bp = eOut(prog(t, 0.25, 0.6));
  ctx.save();
  ctx.globalAlpha *= bp;
  ctx.translate(0, (1 - bp) * 60);
  ctx.shadowColor = 'rgba(124,92,255,.6)'; ctx.shadowBlur = 50;
  rr(120, 640, 840, 130, 65); ctx.fillStyle = '#fff'; ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = '#8a8fa8'; ctx.lineWidth = 8; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(195, 700, 22, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(211, 716); ctx.lineTo(228, 733); ctx.stroke();

  const full = 'اسم مشروعك';
  const typed = full.slice(0, Math.floor(prog(t, 0.6, 1.6) * full.length + 0.001));
  ctx.font = `700 56px ${FONT}`; ctx.direction = 'rtl'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#14162e'; ctx.fillText(typed, 900, 704);
  if (Math.floor(t * 3) % 2 === 0 && t < 2.2) {
    const w = ctx.measureText(typed).width;
    ctx.fillStyle = PURPLE; ctx.fillRect(900 - w - 14, 672, 5, 62);
  }
  ctx.restore();

  const rp = prog(t, 1.9, 2.25);
  if (rp > 0) {
    const shake = Math.sin(t * 60) * 14 * (1 - prog(t, 1.9, 2.5));
    ctx.save();
    ctx.globalAlpha *= rp;
    ctx.translate(shake, 0);
    rr(120, 850, 840, 300, 40); ctx.fillStyle = 'rgba(255,77,109,.12)'; ctx.fill();
    ctx.strokeStyle = 'rgba(255,77,109,.7)'; ctx.lineWidth = 4; ctx.stroke();
    text('😶', W / 2, 935, 90, '#fff', { dir: 'ltr' });
    text('لا توجد نتائج', W / 2, 1060, 76, RED, { glow: 25 });
    ctx.restore();
  }
  pop(t, 2.5, '…ولا يعرف أنك موجود أصلًا', W / 2, 1270, 54, '#c5c8e0', { weight: 600 });
}

// 2 — the loss
function scene2(t) {
  const flash = 1 - prog(t, 3.2, 3.45);
  if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash * 0.8})`; ctx.fillRect(0, 0, W, H); }
  pop(t, 3.3, '😬', W / 2, 600, 200, '#fff', { dir: 'ltr' });
  pop(t, 3.5, 'فاختار منافسك', W / 2, 850, 124, '#fff', { weight: 900, glow: 30 });
  pop(t, 4.2, 'لأن عنده موقع… وأنت لا', W / 2, 1020, 62, RED, { weight: 700 });
}

// 3 — the website builds itself
function scene3(t) {
  pop(t, 5.9, 'موقع احترافي', W / 2, 310, 104, hGrad(-300, 300), { weight: 900 });
  pop(t, 6.2, 'باسم مشروعك 🚀', W / 2, 430, 72, '#fff');

  const up = eOut(prog(t, 6.1, 6.8));
  const px = 300, py = 540 + (1 - up) * 500, pw = 480, ph = 900;
  ctx.save();
  ctx.globalAlpha *= up;
  ctx.shadowColor = 'rgba(124,92,255,.7)'; ctx.shadowBlur = 80;
  rr(px, py, pw, ph, 64); ctx.fillStyle = '#05060f'; ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = '#2b2f55'; ctx.lineWidth = 6; ctx.stroke();

  rr(px + 16, py + 16, pw - 32, ph - 32, 50); ctx.clip();
  ctx.fillStyle = '#0f1230'; ctx.fillRect(px, py, pw, ph);

  const sx = px + 16, sy = py + 16, sw = pw - 32;
  const block = (at, draw) => {
    const p = eOut(prog(t, at, at + 0.4));
    if (p <= 0) return;
    ctx.save(); ctx.globalAlpha *= p; ctx.translate(0, (1 - p) * 50); draw(); ctx.restore();
  };
  // navbar
  block(6.9, () => {
    ctx.fillStyle = '#181c44'; ctx.fillRect(sx, sy, sw, 90);
    rr(sx + sw - 150, sy + 30, 120, 30, 15); ctx.fillStyle = hGrad(sx + sw - 150, sx + sw - 30); ctx.fill();
    for (let i = 0; i < 3; i++) { rr(sx + 30 + i * 70, sy + 37, 50, 16, 8); ctx.fillStyle = '#3a3f75'; ctx.fill(); }
  });
  // hero
  block(7.25, () => {
    rr(sx + 24, sy + 114, sw - 48, 300, 28);
    const g = ctx.createLinearGradient(sx, sy + 114, sx + sw, sy + 414);
    g.addColorStop(0, '#3b2a9c'); g.addColorStop(1, '#1d6fc4');
    ctx.fillStyle = g; ctx.fill();
    rr(sx + sw - 54 - 280, sy + 170, 280, 34, 17); ctx.fillStyle = 'rgba(255,255,255,.95)'; ctx.fill();
    rr(sx + sw - 54 - 200, sy + 224, 200, 24, 12); ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.fill();
    rr(sx + sw - 54 - 240, sy + 262, 240, 24, 12); ctx.fill();
  });
  // button
  block(7.6, () => {
    const pulse = 1 + Math.sin(t * 8) * 0.03;
    ctx.translate(sx + sw - 54 - 90, sy + 350); ctx.scale(pulse, pulse);
    rr(-90, -28, 180, 56, 28); ctx.fillStyle = '#ffb347'; ctx.fill();
  });
  // cards
  [0, 1].forEach(i => block(7.95 + i * 0.3, () => {
    const cw = (sw - 72) / 2, cx = sx + 24 + i * (cw + 24), cy = sy + 444;
    rr(cx, cy, cw, 260, 24); ctx.fillStyle = '#181c44'; ctx.fill();
    rr(cx + 18, cy + 18, cw - 36, 130, 16); ctx.fillStyle = i ? '#2a5fb8' : '#5a3fd6'; ctx.fill();
    rr(cx + 18, cy + 170, cw - 36, 20, 10); ctx.fillStyle = '#4a4f8a'; ctx.fill();
    rr(cx + 18 + (cw - 36) * 0.4, cy + 206, (cw - 36) * 0.6, 20, 10); ctx.fill();
  }));
  block(8.5, () => {
    rr(sx + 24, sy + 728, sw - 48, 110, 24); ctx.fillStyle = '#181c44'; ctx.fill();
    rr(sx + 48, sy + 762, sw - 96, 42, 21); ctx.fillStyle = hGrad(sx + 48, sx + sw - 48); ctx.fill();
  });
  ctx.restore();

  // "ready" badge
  const bp = prog(t, 8.8, 9.15);
  if (bp > 0) {
    ctx.save();
    ctx.globalAlpha *= bp;
    ctx.translate(790, 620); ctx.rotate(0.12); ctx.scale(0.6 + 0.4 * eBack(bp), 0.6 + 0.4 * eBack(bp));
    ctx.shadowColor = 'rgba(46,213,115,.8)'; ctx.shadowBlur = 40;
    rr(-150, -55, 300, 110, 55); ctx.fillStyle = '#2ed573'; ctx.fill();
    ctx.shadowBlur = 0;
    text('جاهز ✓', 0, 4, 60, '#05260f', { weight: 900 });
    ctx.restore();
  }
  pop(t, 7.0, 'تصميم  •  تطوير  •  متاجر إلكترونية', W / 2, 1520, 46, '#c5c8e0', { weight: 600 });
}

// 4 — brand + call to action
function logoMark(cx, cy, s) {
  ctx.save();
  ctx.translate(cx, cy); ctx.scale(s, s);
  ctx.shadowColor = 'rgba(124,92,255,.9)'; ctx.shadowBlur = 60;
  ctx.beginPath(); ctx.arc(0, 0, 190, 0, Math.PI * 2); ctx.fillStyle = '#0d0f2b'; ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = hGrad(-190, 190); ctx.lineWidth = 6; ctx.stroke();
  ctx.lineWidth = 34; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = hGrad(-100, 100, '#ffffff', '#9d86ff');
  ctx.beginPath();
  ctx.moveTo(-100, -55); ctx.lineTo(-50, 65); ctx.lineTo(0, -20); ctx.lineTo(50, 65); ctx.lineTo(100, -55);
  ctx.stroke();
  // cursor arrow
  ctx.fillStyle = PURPLE;
  ctx.beginPath(); ctx.moveTo(118, -120); ctx.lineTo(160, -100); ctx.lineTo(140, -88); ctx.lineTo(130, -68); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function scene4(t) {
  const lp = prog(t, 9.9, 10.35);
  if (lp > 0) { ctx.save(); ctx.globalAlpha *= lp; logoMark(W / 2, 600, 0.6 + 0.4 * eBack(lp)); ctx.restore(); }
  pop(t, 10.2, 'Webora', W / 2, 890, 140, '#fff', { weight: 900, dir: 'ltr', glow: 30 });
  pop(t, 10.5, 'خلّي مشروعك أونلاين ✨', W / 2, 1020, 62, '#c5c8e0', { weight: 700 });

  const cp = prog(t, 10.9, 11.25);
  if (cp > 0) {
    const pulse = 1 + Math.sin((t - 10.9) * 7) * 0.035;
    ctx.save();
    ctx.globalAlpha *= cp;
    ctx.translate(W / 2, 1210); ctx.scale(pulse * (0.7 + 0.3 * eBack(cp)), pulse * (0.7 + 0.3 * eBack(cp)));
    ctx.shadowColor = 'rgba(124,92,255,.9)'; ctx.shadowBlur = 50;
    rr(-420, -70, 840, 140, 70); ctx.fillStyle = hGrad(-420, 420); ctx.fill();
    ctx.shadowBlur = 0;
    text('اكتب «موقع» في التعليقات 👇', 0, 4, 54, '#fff', { weight: 900 });
    ctx.restore();
  }
  pop(t, 11.3, '@webora48', W / 2, 1390, 50, '#fff', { weight: 700, dir: 'ltr' });
  pop(t, 11.6, 'تابعنا… القادم لمشروعك أنت 👀', W / 2, 1480, 44, '#c5c8e0', { weight: 600 });
}

const SCENES = [[0, 3.2, scene1], [3.2, 5.8, scene2], [5.8, 9.8, scene3], [9.8, DUR + 1, scene4]];

function render(t) {
  background(t, sceneAlpha(t, 1.9, 5.8, 0.4));
  for (const [a, b, fn] of SCENES) {
    if (t < a || t >= b) continue;
    ctx.save(); ctx.globalAlpha = sceneAlpha(t, a, b); fn(t); ctx.restore();
  }
}
window.renderAt = t => { paused = true; render(t); };

let paused = false, t0 = performance.now();
function loop(now) {
  if (!paused) render(((now - t0) / 1000) % DUR);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

const statusEl = document.getElementById('status');
const recBtn = document.getElementById('rec');
window.recordResult = null;

async function record() {
  recBtn.disabled = true; paused = true; window.recordResult = null;
  const mime = ['video/mp4;codecs=avc1.640028', 'video/mp4;codecs=avc1.42E01E', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm']
    .find(m => MediaRecorder.isTypeSupported(m));
  const ext = mime.startsWith('video/mp4') ? 'mp4' : 'webm';
  // captureStream(0) + requestFrame() pushes every rendered frame instead of sampling on a timer
  const stream = canvas.captureStream(0);
  const track = stream.getVideoTracks()[0];
  const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 10e6 });
  const chunks = [];
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  const done = new Promise(r => rec.onstop = r);
  render(0); rec.start(); track.requestFrame();
  const start = performance.now(); let frames = 0;
  await new Promise(resolve => {
    // ticks come from a worker so recording keeps its pace even when the tab is in the background
    const ticker = new Worker(URL.createObjectURL(new Blob([`setInterval(() => postMessage(0), ${1000 / FPS})`])));
    ticker.onmessage = () => {
      const t = (performance.now() - start) / 1000;
      if (t >= DUR) { ticker.terminate(); return resolve(); }
      render(t); track.requestFrame(); frames++;
      statusEl.textContent = `جارٍ التسجيل… ${t.toFixed(1)} / ${DUR} ث`;
    };
  });
  rec.stop(); await done;
  const blob = new Blob(chunks, { type: mime });
  const res = await fetch('/save?ext=' + ext, { method: 'POST', body: blob });
  const saved = await res.json();
  window.recordResult = { mime, ext, bytes: blob.size, frames, saved };
  statusEl.textContent = `تم الحفظ: ${saved.file}`;
  recBtn.disabled = false; paused = false; t0 = performance.now();
  return window.recordResult;
}
recBtn.onclick = record;
window.record = record;
</script>
</body>
</html>
